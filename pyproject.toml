[project]
name = "local-sys1"
version = "0.1.0"
description = "Local Jev-style System One decision models on Apple Silicon: vllm-metal + CLM, Ollaya, and a benchmark"
requires-python = ">=3.12"
dependencies = [
    "contrastive-lm>=0.1.0",
    "requests>=2.28",
    "tokenizers>=0.20",
    "huggingface_hub>=0.20",
    # Without this pin uv resolved fastapi 0.125 + pydantic 1.10.13, which fails at import on Python 3.13.
    "pydantic>=2",
    # AnyJev's vLLM backend reads label logprobs over HTTP; it imports transformers only for AutoTokenizer, so
    # torch is not needed. Pinned: serve/anyjev_server.py reuses the backend's tokenizer, name and base_url attributes.
    "anyjev==0.1.0",
    "transformers>=4.53",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# contrastive-lm lists vllm as a dependency, but clm-serve only calls the embeddings endpoint over HTTP
# (src/clm/embedder.py). The encoder runs in Homebrew's vllm-metal, so skip the second vllm install.
override-dependencies = ["vllm; sys_platform == 'never'"]
